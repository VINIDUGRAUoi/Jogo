name: "Exportar APK Android (Godot 4)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build Tools e Platform Tools do Android
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmake;3.22.1" "ndk;23.2.8568313"

      - name: Gerar Keystore de Depuração (Debug Key)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Exportar APK com Godot 4
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          relative_project_path: "./"
          archive_output: false

      - name: Salvar o APK gerado como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: MetropoleBR-Android-APK
          path: build/android/
